<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMM 钢厂档案 | Plant Dossier</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--navy:#1e3a5f;--red:#b03a2e;--ink:#1f2933;--muted:#6b7785;--line:#e6e9ed;--bg:#f5f6f8;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55}
a{color:#2c6fb7}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 24px}
.logo{background:var(--red);font-weight:800;border-radius:7px;padding:4px 8px;font-size:13px;letter-spacing:.5px}
.top .tt{font-weight:700;font-size:14px;flex:1}
.top a,.top button{color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:6px;padding:6px 11px;font-size:12px;text-decoration:none;cursor:pointer}
.top a:hover,.top button:hover{background:rgba(255,255,255,.24)}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 40px}
.hero h1{margin:0;font-size:24px;color:var(--navy)}
.hero .nm{color:var(--muted);font-size:14px;margin-top:2px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{font-size:11px;border-radius:5px;padding:2px 8px;background:#eef1f5;color:var(--navy)}
.tag.red{background:var(--red);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:22px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
.vstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:18px}
.vmod{display:block;background:var(--card);border:1px solid var(--line);border-top:4px solid #ccc;border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink)}
.vmod b{display:block;font-size:12.5px;color:var(--navy)}.vmod span{font-size:10.5px;color:var(--muted)}
.vmod:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;scroll-margin-top:64px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sh h2{margin:0;font-size:16px;color:var(--navy);flex:1}
.badge{font-size:10.5px;color:#fff;border-radius:4px;padding:1px 7px;white-space:nowrap}
.note{background:#f8f9fb;border-left:3px solid var(--navy);padding:8px 12px;border-radius:0 6px 6px 0;margin:4px 0 12px;color:#384350}
.gaps{margin-top:12px;background:#fff8ec;border:1px solid #f1dcb3;border-radius:7px;padding:8px 12px;color:#8a5a12;font-size:12px}
.empty{color:var(--muted);padding:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #f0f2f4;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:hover td{background:#fafbfc}
.kind{display:inline-block;min-width:36px;text-align:center;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;color:#fff}
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:14px}
.line{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.line .h{font-weight:700;color:var(--navy)}.line .s{color:var(--muted);font-size:11.5px;margin-top:3px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;padding:3px 0}.tl div:before{content:"";position:absolute;left:-20px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.tl b{color:var(--red);margin-right:8px;font-variant-numeric:tabular-nums}
.news{display:grid;grid-template-columns:100px 60px 1fr;gap:4px 12px;padding:8px 0;border-bottom:1px solid #f0f2f4}
.news .d{color:var(--muted);font-variant-numeric:tabular-nums}.tier{font-size:10px;border:1px solid #b8c0ca;border-radius:4px;padding:0 5px;color:#4a5562;height:fit-content;text-align:center}
.cost input{width:90px;padding:4px 6px;border:1px solid #cfd5dc;border-radius:5px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.cost input.nm{width:64px}
.cost td.src{color:var(--muted);font-size:11px}
.cost tr.tot td{font-weight:800;font-size:14px;color:var(--navy);border-top:2px solid var(--navy);border-bottom:0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 4px;background:#eef1f5}
.bar i{display:block;height:100%}
.leg{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.foot{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}
#err{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.vstrip{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr}.news{grid-template-columns:90px 1fr}.news .tier{display:none}}
@media print{.top{position:static;background:#fff;color:var(--navy);border-bottom:2px solid var(--navy)}.top a,.top button{display:none}body{background:#fff}section.card{break-inside:avoid;border-color:#ccd}.vstrip{display:none}.cost input{border:0}}
</style></head><body>
<div class="top"><span class="logo">SMM</span><span class="tt" id="tt"></span>
<a id="backMap" href="index.html">← 地图</a><button onclick="setLang(lang==='zh'?'en':'zh')" id="langBtn">EN</button><button onclick="window.print()" id="printBtn">PDF</button></div>
<div class="wrap"><div id="err"></div><div id="app"></div>
<div class="foot" id="foot"></div></div>
<script>
const T={zh:{tt:"钢厂深度档案",back:"← 返回地图",print:"打印 / 导出 PDF",capOp:"在产粗钢产能",capPipe:"在建 + 规划",iron:"炼铁产能",equip:"主体设备",start:"投产年份",
  m:{equipment:"设备",capacity:"产能变化",news:"新闻动态",financials:"财报",supply:"产业链 · 原料",cost:"成本画像",satellite:"卫星 · 位置"},
  st:{none:"未开始",auto:"批量数据·待核",draft:"AI 初稿·待核",verified:"已核实",reviewed:"复核签字"},
  empty:"该模块尚未开始,将按优先级逐厂补充。",gaps:"待补",src:"来源",scope:"口径",lines:"关键产线 / 核对结果",units:"逐座设备",
  cols:["类型","名称","容积 / 吨位","产能","投产","状态","制造商","最近大修"],timeline:"大事记",phases:"分期产能",ev:"已核实入库事件",
  chartCrude:"粗钢产能(转炉/电炉/感应炉)",chartIron:"炼铁产能(高炉/DRI)",chartFut:"在建/规划",unknownYr:"台设备投产年份未知,未计入曲线",
  item:"项目",detail:"内容",mat:"原料",psrc:"价格来源",price:"价格",unit:"单位",norm:"单耗 t/t",sub:"小计 / 吨钢",total:"吨钢原料成本",
  coalPh:"手动输入",costMiss:"焦煤价格未输入,合计仅含矿+废钢",coords:"坐标",notFound:"未找到该钢厂档案。",
  mat_ore:"铁矿石",mat_coal:"炼焦煤",mat_scrap:"废钢",kind:{integrated:"长流程钢厂",eaf:"短流程钢厂",rolling:"轧钢厂",dri:"DRI 厂",bf_iron:"独立炼铁厂",pipeline_steel:"规划钢厂",other_steel:"炼钢厂",iron_other:"炼铁厂"},
  smap:{operating:"在产","operating pre-retirement":"在产(拟退役)",mothballed:"封存",construction:"在建",announced:"规划",retired:"已退役",cancelled:"已取消","mothballed pre-retirement":"封存(拟退役)"},
  foot:"数据来源:SMM 上海有色网 · 基准 2026-03 + 逐厂增量核实 · 仅供参考",owner:"所属"},
 en:{tt:"Plant dossier",back:"← Map",print:"Print / PDF",capOp:"Operating crude capacity",capPipe:"Construction + announced",iron:"Ironmaking capacity",equip:"Main units",start:"Start year",
  m:{equipment:"Equipment",capacity:"Capacity history",news:"News",financials:"Financials",supply:"Supply chain",cost:"Cost profile",satellite:"Satellite · location"},
  st:{none:"Not started",auto:"Bulk data · unverified",draft:"AI draft · unverified",verified:"Verified",reviewed:"Signed off"},
  empty:"Not started yet — will be filled plant by plant by priority.",gaps:"Gaps",src:"Source",scope:"Scope",lines:"Key lines / cross-check",units:"Unit list",
  cols:["Type","Name","Size","Capacity","Start","Status","Maker","Last reline"],timeline:"Milestones",phases:"Capacity by phase",ev:"Verified events",
  chartCrude:"Crude steel (BOF/EAF/IF)",chartIron:"Ironmaking (BF/DRI)",chartFut:"Construction/announced",unknownYr:"unit(s) with unknown start year not plotted",
  item:"Item",detail:"Detail",mat:"Material",psrc:"Price source",price:"Price",unit:"Unit",norm:"t / t crude",sub:"Subtotal / t",total:"Raw-material cost / t",
  coalPh:"enter",costMiss:"No coal price entered — total covers ore + scrap only",coords:"Coordinates",notFound:"Dossier not found.",
  mat_ore:"Iron ore",mat_coal:"Coking coal",mat_scrap:"Scrap",kind:{integrated:"Integrated (BF-BOF)",eaf:"Electric (EAF)",rolling:"Rolling mill",dri:"DRI plant",bf_iron:"Merchant ironworks",pipeline_steel:"Planned steel plant",other_steel:"Steel plant",iron_other:"Ironworks"},
  smap:{operating:"Operating","operating pre-retirement":"Operating (pre-retirement)",mothballed:"Mothballed",construction:"Construction",announced:"Announced",retired:"Retired",cancelled:"Cancelled","mothballed pre-retirement":"Mothballed (pre-retirement)"},
  foot:"Source: SMM (Shanghai Metals Market) · baseline Mar 2026 + plant-level verified updates · for reference only",owner:"Owner"}};
const SC={none:"#c9ced4",auto:"#8fb2de",draft:"#e0a84a",verified:"#3c9d5d",reviewed:"#1f6b3a"};
const KC={BF:"#1B6CA8",DRI:"#2E9E83",BOF:"#b03a2e",EAF:"#E0731B",IF:"#9b59b6",OHF:"#7f8c8d",HSM:"#34495e"};
const Q=new URLSearchParams(location.search), ID=Q.get('id');
let lang=Q.get('lang')||(()=>{try{return localStorage.getItem('gist_lang')}catch(e){return null}})()||'zh'; if(lang!=='en')lang='zh';
let D=null, chart=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tx=o=>o==null?'':(typeof o==='string'?o:(o[lang]||o.zh||o.en||''));
const L=()=>T[lang]; const smap=s=>L().smap[s]||s||'—';
const lnk=(u,l)=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l||L().src)+' ↗</a>':'';
const fx=(v,d=1)=>v==null||isNaN(v)?'—':(+v).toFixed(d);
function setLang(l){lang=l;try{localStorage.setItem('gist_lang',l)}catch(e){}render();}
function badge(s){return '<span class="badge" style="background:'+SC[s||'none']+'">'+L().st[s||'none']+'</span>';}
function sec(k,m,body){const s=(m&&m.status)||'none';
  return '<section class="card" id="'+k+'"><div class="sh"><h2>'+L().m[k]+'</h2>'+badge(s)+(m&&m.reviewer?'<span style="font-size:11px;color:var(--muted)">'+esc(m.reviewer)+' · '+esc(m.reviewed_at||'')+'</span>':'')+'</div>'
   +(s==='none'?'<div class="empty">'+L().empty+'</div>':body)+(m&&m.gaps&&m.gaps.length?'<div class="gaps">⚠ '+L().gaps+':'+m.gaps.map(esc).join(' · ')+'</div>':'')+'</section>';}
function note(m){return (m&&m.note?'<div class="note">'+esc(tx(m.note))+(typeof m.src==='string'?' '+lnk(m.src):'')+(m.scope?' <span style="color:var(--muted)">('+L().scope+':'+esc(tx(m.scope))+')</span>':'')+'</div>':(m&&m.scope?'<div class="note">'+L().scope+':'+esc(tx(m.scope))+'</div>':''));}
const yr=s=>{const n=parseInt(s);return isNaN(n)?null:n;};
function render(){
  const t=L(); document.documentElement.lang=lang==='zh'?'zh':'en';
  document.getElementById('tt').textContent=t.tt; document.getElementById('langBtn').textContent=lang==='zh'?'EN':'中';
  document.getElementById('printBtn').textContent=t.print; const bm=document.getElementById('backMap'); bm.textContent=t.back; bm.href='index.html?plant='+encodeURIComponent(ID||'')+'&lang='+lang;
  document.getElementById('foot').textContent=t.foot+(D?' · '+D.id+' · '+D.built:'');
  if(!D)return; const p=D.plant||{}, M=D.modules||{};
  document.title=(p.en||D.en)+' | SMM';
  const units=(M.equipment&&M.equipment.units)||[]; const byK={}; units.forEach(u=>{byK[u.kind]=(byK[u.kind]||0)+1;});
  let h='<div class="hero"><h1>'+esc(p.en||D.en)+'</h1>'+(p.nm&&p.nm!==p.en?'<div class="nm">'+esc(p.nm)+'</div>':'')
   +'<div class="meta">'+(D.tier?'<span class="tag red">'+D.tier+'</span>':'')+'<span class="tag">'+esc(t.kind[p.type]||p.type||'')+'</span><span class="tag">'+esc(smap(p.status))+'</span>'
   +'<span class="tag">📍 '+esc([p.muni,p.sub,p.cy].filter(x=>x&&!/^(unknown|n\/a)$/i.test(String(x).trim())).join(', '))+'</span>'+(p.owner?'<span class="tag">'+t.owner+':'+esc(String(p.owner).replace(/\s*\[.*?\]/g,''))+'</span>':'')+'</div></div>';
  h+='<div class="kpis">'+[[fx(p.cap_op),'Mt',t.capOp],[fx(p.cap_pipe),'Mt',t.capPipe],[fx(p.iron_op||((p.bf||0)+(p.dri||0))),'Mt',t.iron],
     [Object.keys(byK).map(k=>byK[k]+' '+k).join(' · ')||'—','',t.equip],[p.start||'—','',t.start]]
     .map((k,i)=>'<div class="kpi"><div class="v" style="'+(i===3?'font-size:15px;line-height:1.9':'')+'">'+esc(k[0])+(k[1]?'<small>'+k[1]+'</small>':'')+'</div><div class="l">'+k[2]+'</div></div>').join('')+'</div>';
  h+='<div class="vstrip">'+Object.keys(t.m).map(k=>{const s=(M[k]||{}).status||'none';return '<a class="vmod" href="#'+k+'" style="border-top-color:'+SC[s]+'"><b>'+t.m[k]+'</b><span>'+t.st[s]+'</span></a>';}).join('')+'</div>';
  // —— 设备 ——
  const E=M.equipment||{}; let b=note(E);
  if(E.lines&&E.lines.length)b+='<div style="font-weight:700;margin:4px 0 8px">'+t.lines+'</div><div class="lines">'+E.lines.map(l=>'<div class="line"><div class="h"><span class="kind" style="background:'+(KC[l.kind]||'#556')+'">'+esc(l.kind)+'</span> '+esc(tx(l.name))+'</div><div style="margin-top:4px;font-variant-numeric:tabular-nums">'+[l.size_m3?l.size_m3.toLocaleString()+' m³':'',l.cap_mt?l.cap_mt+' Mt':'',l.start||''].filter(Boolean).join(' · ')+'</div><div class="s">'+esc(tx(l.detail))+' '+lnk(l.src)+'</div></div>').join('')+'</div>';
  if(units.length){b+='<div style="font-weight:700;margin:4px 0 6px">'+t.units+' ('+units.length+')</div><table class="t"><tr>'+t.cols.map((c,i)=>'<th'+([2,3,4].includes(i)?' class="n"':'')+'>'+c+'</th>').join('')+'</tr>'
    +units.map(u=>'<tr><td><span class="kind" style="background:'+(KC[u.kind]||'#556')+'">'+u.kind+'</span></td><td>'+esc(u.name||'—')+'</td><td class="n">'+(u.size_m3?u.size_m3.toLocaleString()+' m³':(u.size_t?u.size_t+' t':'—'))+'</td><td class="n">'+(u.cap_mt!=null?u.cap_mt.toFixed(2)+' Mt':'—')+'</td><td class="n">'+esc(u.start||'—')+'</td><td>'+esc(smap(u.status))+'</td><td>'+esc(u.maker||'—')+'</td><td>'+esc(u.last_reline||'—')+((u.relinings||[]).length?' <span style="color:var(--muted)">(×'+u.relinings.length+')</span>':'')+'</td></tr>').join('')+'</table>';}
  h+=sec('equipment',E,b);
  // —— 产能变化 ——
  const C=M.capacity||{}; b=note(C)+'<div class="two"><div><div id="capChart" style="height:280px"></div><div id="capChartNote" style="font-size:11px;color:var(--muted)"></div></div><div>';
  if(C.timeline&&C.timeline.length)b+='<div style="font-weight:700;margin-bottom:6px">'+t.timeline+'</div><div class="tl">'+C.timeline.map(x=>'<div><b>'+x.yr+'</b>'+esc(tx(x.ev))+'</div>').join('')+'</div>';
  if(C.phases&&C.phases.length)b+='<div style="font-weight:700;margin:12px 0 4px">'+t.phases+'</div><table class="t">'+C.phases.map(x=>'<tr><td>'+esc(smap(x.st))+'</td><td class="n">'+fx(x.cap,2)+' Mt</td><td class="n">'+(x.yr||'—')+'</td></tr>').join('')+'</table>';
  if(C.events&&C.events.length)b+='<div style="font-weight:700;margin:12px 0 4px">'+t.ev+'</div><table class="t">'+C.events.map(e=>'<tr><td class="n">'+esc(e.d)+'</td><td>'+esc(e.et)+(e.st?' → '+esc(smap(e.st)):'')+'</td><td class="n">'+(e.cap?e.cap+' Mt':'')+(e.inv?' $'+e.inv+'M':'')+'</td></tr>').join('')+'</table>';
  b+='</div></div>'; h+=sec('capacity',(C.status?C:{status:units.length?'auto':'none'}),b);
  // —— 新闻 ——
  const N=M.news||{}; const items=(N.items||[]).slice().sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  h+=sec('news',N,note(N)+items.map(i=>'<div class="news"><span class="d">'+esc(i.d)+'</span><span class="tier">Tier '+esc(i.tier)+'</span><span>'+esc(tx(i.t))+' '+lnk(i.u)+'</span></div>').join(''));
  // —— 财报 ——
  const F=M.financials||{};
  h+=sec('financials',F,note(F)+'<div style="font-weight:700;margin-bottom:6px">'+esc(F.entity||'')+' · '+esc(F.fy||'')+' · '+esc(F.ccy||'')+'</div><table class="t">'+(F.rows||[]).map(r=>'<tr><td style="width:40%">'+esc(tx(r.k))+'</td><td class="n" style="text-align:left">'+esc(r.v)+'</td></tr>').join('')+'</table><div style="margin-top:8px;font-size:12px">'+(F.src||[]).map((u,i)=>lnk(u,L().src+' '+(i+1))).join(' &nbsp; ')+'</div>');
  // —— 产业链 ——
  const S=M.supply||{};
  h+=sec('supply',S,note(S)+'<table class="t"><tr><th style="width:18%">'+t.item+'</th><th>'+t.detail+'</th><th style="width:10%">'+t.src+'</th></tr>'+(S.items||[]).map(r=>'<tr><td><b>'+esc(tx(r.k))+'</b></td><td>'+esc(tx(r.v))+'</td><td>'+lnk(r.src)+'</td></tr>').join('')+'</table>');
  // —— 成本 ——
  const K=M.cost||{}, P=K.prices||{}, NM=K.norms||{};
  b=note(K); if(K.status&&K.status!=='none'){b+='<div style="font-weight:700;margin-bottom:6px">'+esc(K.route||'')+'</div><table class="t cost"><tr><th>'+t.mat+'</th><th>'+t.psrc+'</th><th class="n">'+t.price+'</th><th>'+t.unit+'</th><th class="n">'+t.norm+'</th><th class="n">'+t.sub+'</th></tr>';
    ['ore','coal','scrap'].forEach(k=>{if(NM[k]==null)return;const pr=P[k]||{};
      b+='<tr><td><b>'+t['mat_'+k]+'</b></td><td class="src">'+esc(pr.name||'')+(pr.date?' · '+pr.date:'')+'</td><td class="n"><input id="cp_'+k+'" type="number" step="0.5" value="'+(pr.v!=null?pr.v:'')+'" placeholder="'+t.coalPh+'" oninput="calc()"></td><td>'+esc(pr.unit||'')+'</td><td class="n"><input class="nm" id="cn_'+k+'" type="number" step="0.01" value="'+NM[k]+'" oninput="calc()"></td><td class="n" id="cs_'+k+'">—</td></tr>';});
    b+='<tr class="tot"><td colspan="5">'+t.total+'</td><td class="n" id="costTot">—</td></tr></table><div class="bar" id="costBar"></div><div class="leg" id="costLeg"></div><div id="costMiss" style="font-size:11.5px;color:#8a5a12;margin-top:6px"></div>';}
  h+=sec('cost',K,b);
  // —— 卫星 ——
  const G=M.satellite||{};
  const satImg=(p.lat!=null)?(function(){const la=+p.lat,lo=+p.lng,dLa=2/111,dLo=2/(111*Math.max(.2,Math.cos(la*Math.PI/180)));
    return '<a href="https://www.arcgis.com/home/webmap/viewer.html?center='+lo+','+la+'&level=15&basemapUrl=https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" target="_blank" rel="noopener"><img alt="satellite" loading="lazy" style="width:100%;max-width:760px;border-radius:10px;border:1px solid #e3e7ec;display:block;margin:8px 0" src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox='+(lo-dLo).toFixed(5)+','+(la-dLa).toFixed(5)+','+(lo+dLo).toFixed(5)+','+(la+dLa).toFixed(5)+'&bboxSR=4326&imageSR=3857&size=1000,620&format=jpg&f=image"></a><div style="font-size:11px;color:#8a94a0">Imagery © Esri, Maxar, Earthstar Geographics</div>';})():'';
  h+=sec('satellite',G,note(G)+'<div>'+t.coords+':<b style="font-variant-numeric:tabular-nums">'+(p.lat!=null?(+p.lat).toFixed(4)+', '+(+p.lng).toFixed(4):'—')+'</b></div>'+satImg+(G.links||[]).map(l=>'<div style="margin-top:6px">🛰 '+lnk(l.u,tx(l.t))+'</div>').join(''));
  document.getElementById('app').innerHTML=h; drawChart(units,C); calc();
  if(location.hash){const el=document.querySelector(location.hash);if(el)setTimeout(()=>el.scrollIntoView(),50);}
}
function drawChart(units,C){
  const el=document.getElementById('capChart'); if(!el)return; if(chart){chart.dispose();chart=null;}
  const t=L(), NOW=2026, CR=['BOF','EAF','IF','OHF'], IR=['BF','DRI'];
  const cls=s=>{s=(s||'').toLowerCase();return s.startsWith('retired')||s.startsWith('cancelled')?'ex':(s.startsWith('construction')||s.startsWith('announced')?'fut':'built');};
  const us=units.filter(u=>u.cap_mt>0&&cls(u.status)!=='ex'); const dated=us.filter(u=>yr(u.start)); const miss=us.length-dated.length;
  let pts=dated.map(u=>({y:yr(u.start),v:u.cap_mt,g:CR.includes(u.kind)?'c':(IR.includes(u.kind)?'i':null),f:cls(u.status)==='fut'})).filter(x=>x.g);
  if(!pts.length&&C.phases)pts=C.phases.filter(x=>x.cap>0&&x.yr).map(x=>({y:+x.yr,v:x.cap,g:'c',f:['construction','announced'].includes(x.st)}));
  if(!pts.length){el.style.display='none';return;}
  const y0=Math.min(...pts.map(x=>x.y)), y1=Math.max(NOW,...pts.map(x=>x.y));
  const ser=(g,fut)=>{const out=[];let acc=0,prev=null;for(let y=y0;y<=y1;y++){acc+=pts.filter(x=>x.g===g&&x.y===y&&(fut||!x.f)).reduce((a,x)=>a+x.v,0);const v=+acc.toFixed(2);if(v!==prev||y===y1)out.push([y,v]);prev=v;}return out;};
  const S=[], last={};
  const add=(name,data,color,dash,area)=>{if(!data.length||data[data.length-1][1]===0)return;last[name]=data[data.length-1][1];
    S.push({name,type:'line',step:'end',data,symbol:'circle',symbolSize:6,lineStyle:{color,width:dash?1.8:2.6,type:dash?'dashed':'solid'},itemStyle:{color},
      areaStyle:area?{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:color+'33'},{offset:1,color:color+'05'}])}:undefined});};
  add(t.chartCrude,ser('c',false),'#2E9E83',false,true); add(t.chartIron,ser('i',false),'#1B6CA8',false,false);
  if(pts.some(x=>x.f)){ // 规划线只画增量段:从首个在建/规划年份起步,不与在产线重叠
    const f0=Math.min(...pts.filter(x=>x.f&&x.g==='c').map(x=>x.y)); const full=ser('c',true), built=ser('c',false);
    const at=(arr,y)=>{let v=0;arr.forEach(p=>{if(p[0]<=y)v=p[1];});return v;};
    if(isFinite(f0))add(t.chartFut,[[Math.max(y0,f0-1),at(built,f0-1)]].concat(full.filter(p=>p[0]>=f0)),'#E0731B',true,false);}
  chart=echarts.init(el);
  chart.setOption({grid:{left:6,right:20,top:44,bottom:6,containLabel:true},
    legend:{top:0,left:0,itemWidth:14,itemHeight:8,itemGap:16,textStyle:{fontSize:11,color:'#4a5562'},formatter:n=>n+'  '+(last[n]!=null?last[n].toFixed(1)+' Mt':'')},
    tooltip:{trigger:'axis',confine:true,backgroundColor:'#0e2440',borderWidth:0,textStyle:{color:'#fff',fontSize:12},axisPointer:{lineStyle:{color:'#b03a2e',type:'dotted'}},
      formatter:ps=>'<b>'+Math.round(ps[0].axisValue)+'</b><br>'+ps.map(x=>x.marker+x.seriesName+': '+x.value[1]+' Mt').join('<br>')},
    xAxis:{type:'value',min:y0,max:y1,interval:(y1-y0)<=16?2:((y1-y0)<=40?5:10),axisLabel:{fontSize:11,color:'#8a939d',formatter:v=>Math.round(v)},axisLine:{lineStyle:{color:'#dfe3e8'}},axisTick:{show:false},splitLine:{show:false}},
    yAxis:{type:'value',min:0,splitNumber:4,axisLabel:{fontSize:11,color:'#8a939d',formatter:v=>v+' Mt'},splitLine:{lineStyle:{type:'dashed',color:'#eef0f2'}}},
    series:S.concat([{type:'line',data:[],markLine:{silent:true,symbol:'none',label:{formatter:L().st&&lang==='zh'?'现在':'Now',position:'end',color:'#8a939d',fontSize:10},lineStyle:{color:'#c2c7cd',type:'dashed'},data:[{xAxis:NOW}]}}])});
  document.getElementById('capChartNote').textContent=miss>0?miss+' '+t.unknownYr:'';
}
function calc(){
  const t=L(); let tot=0,miss=false; const PR=((D&&D.modules&&D.modules.cost&&D.modules.cost.prices)||{}); const CUR=Object.values(PR).some(p=>p&&/^元/.test(p.unit||''))?'¥':'$'; const parts=[]; const col={ore:'#1B6CA8',coal:'#34495e',scrap:'#E0731B'};
  ['ore','coal','scrap'].forEach(k=>{const pe=document.getElementById('cp_'+k),ne=document.getElementById('cn_'+k),se=document.getElementById('cs_'+k);if(!pe)return;
    const pv=parseFloat(pe.value),nv=parseFloat(ne.value);if(isNaN(pv)||isNaN(nv)){se.textContent='—';if(k==='coal')miss=true;return;}
    const s=pv*nv;tot+=s;se.textContent=CUR+s.toFixed(0);parts.push([k,s]);});
  const te=document.getElementById('costTot');if(!te)return;te.textContent=CUR+tot.toFixed(0);
  document.getElementById('costBar').innerHTML=parts.map(([k,s])=>'<i style="width:'+(tot?s/tot*100:0)+'%;background:'+col[k]+'"></i>').join('');
  document.getElementById('costLeg').innerHTML=parts.map(([k,s])=>'<span><b style="color:'+col[k]+'">●</b> '+t['mat_'+k]+' '+(tot?(s/tot*100).toFixed(0):0)+'%</span>').join('');
  document.getElementById('costMiss').textContent=miss?'⚠ '+t.costMiss:'';
}
window.addEventListener('resize',()=>{if(chart)chart.resize();});
if(!ID){document.getElementById('err').style.display='block';document.getElementById('err').textContent=T[lang].notFound;render();}
else fetch('sites/'+encodeURIComponent(ID)+'.json?v=202610230151').then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{D=d;render();})
  .catch(()=>{const e=document.getElementById('err');e.style.display='block';e.textContent=T[lang].notFound+' ('+ID+')';render();});
</script></body></html>
