<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>全球钢铁产业分布地图 | SMM Global Steel Industry Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--navy:#0E2440;--navy2:#15314f;--blue:#1B6CA8;--integrated:#C8362F;--eaf:#E0731B;--rolling:#8A8F98;
 --dri:#2E9E83;--iron:#1B6CA8;--special:#9B59B6;--cream:#F6F2E9;--cream2:#FBF8F1;--ink:#1d2733;--muted:#6b7785;
 --line:#e2ddd1;--line2:#d6cfbf;--font:'MiSans','PingFang SC','Microsoft YaHei','Hiragino Sans GB',-apple-system,system-ui,'Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--cream);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(100deg,var(--navy),var(--navy2) 60%,#1c3b5e);color:#fff;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;height:60px;flex:0 0 60px;box-shadow:0 2px 12px rgba(14,36,64,.25);z-index:1200}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--integrated),#e0564f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.title h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.title .tag{font-size:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:2px 6px;border-radius:4px;font-weight:600}
.title p{font-size:10px;color:#aebfd2;margin-top:2px}
.kpis{display:flex;gap:16px;align-items:center}
.kpi{text-align:right;line-height:1.15}
.kpi .v{font-size:17px;font-weight:800}
.kpi .v.red{color:#ff8a82}.kpi .v.orange{color:#ffb074}.kpi .v.green{color:#7fd8be}
.kpi .l{font-size:9px;color:#9fb2c8;margin-top:1px}
.kpi-div{width:1px;height:28px;background:rgba(255,255,255,.16)}
.btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 11px;font-size:11px;cursor:pointer;font-weight:600}
.btn:hover{background:rgba(255,255,255,.22)}
.lang-tog{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:7px;overflow:hidden}
.lang-tog span{padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;color:#aebfd2}
.lang-tog span.on{background:#fff;color:var(--navy)}
#builtTag{font-size:9px;color:#9fb2c8;white-space:nowrap}
#newdata{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3500;background:var(--navy);color:#fff;
  border-radius:10px;padding:9px 14px;font-size:12px;box-shadow:0 8px 26px rgba(14,36,64,.4);display:flex;align-items:center;gap:12px}
#newdata button{background:var(--integrated);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
#newdata button:hover{background:#b32d27}
.body{flex:1;display:flex;min-height:0;position:relative}
.rail{width:256px;flex:0 0 256px;background:var(--cream2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:1000}
.rail-scroll{overflow-y:auto;flex:1;padding:13px}
.rail-scroll::-webkit-scrollbar,.dash-scroll::-webkit-scrollbar,.pop-body::-webkit-scrollbar{width:7px}
.rail-scroll::-webkit-scrollbar-thumb,.dash-scroll::-webkit-scrollbar-thumb,.pop-body::-webkit-scrollbar-thumb{background:#cfc7b6;border-radius:4px}
.sec{margin-bottom:15px}
.sec h3{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec h3 .hint{font-size:9px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.layer{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;margin-bottom:5px;border:1px solid transparent;transition:.12s;background:#fff}
.layer:hover{border-color:var(--line2)}
.layer.off{opacity:.4}
.layer .dot{width:13px;height:13px;border-radius:50%;flex:0 0 13px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.layer .sq{border-radius:3px}
.layer .nm{font-size:12px;font-weight:600;flex:1}
.layer .ct{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:12px;background:#fff;font-family:inherit}
.search:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10.5px;padding:4px 9px;border-radius:14px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.pc.on{background:var(--blue);border-color:var(--blue)}
.slider-wrap input{width:100%}
.slider-val{font-size:10.5px;color:var(--muted);margin-top:3px}
.region-sel{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;font-size:12px;background:#fff;font-family:inherit;cursor:pointer}
.reset{width:100%;margin-top:2px;padding:7px;border:1px dashed var(--line2);border-radius:8px;background:#fff;font-size:11px;color:var(--muted);cursor:pointer;font-weight:600}
.reset:hover{color:var(--integrated);border-color:var(--integrated)}
#map{flex:1;background:#cfdbe0;z-index:1;position:relative}
.rail,.dash{transition:flex-basis .25s ease,width .25s ease}
.rail.collapsed{flex-basis:0;width:0;min-width:0;overflow:hidden;border:none}
.dash.collapsed{flex-basis:0;width:0;min-width:0;overflow:hidden;border:none;box-shadow:none}
.maptgl{position:absolute;top:50%;transform:translateY(-50%);z-index:1100;width:20px;height:48px;background:#fff;border:1px solid var(--line2);color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(20,40,70,.18);padding:0}
.maptgl.l{left:0;border-radius:0 9px 9px 0;border-left:none}
.maptgl.r{right:0;border-radius:9px 0 0 9px;border-right:none}
.maptgl:hover{background:var(--cream);color:var(--integrated)}
.map-tools{position:absolute;top:10px;right:10px;z-index:1100;display:flex;gap:6px}
.map-tools button{background:#fff;border:1px solid var(--line2);color:var(--navy);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(20,40,70,.15)}
.map-tools button:hover{background:var(--cream);color:var(--integrated)}
.scrim{display:none;position:absolute;inset:0;background:rgba(14,36,64,.35);z-index:1400}
@media(max-width:980px){
  .rail,.dash{position:absolute;top:0;bottom:0;z-index:1600;box-shadow:0 0 30px rgba(14,36,64,.3);transition:transform .25s ease}
  .rail{left:0;width:82vw;max-width:300px;transform:translateX(-102%)}
  .dash{right:0;width:88vw;max-width:360px;transform:translateX(102%)}
  body.rail-open .rail{transform:none}
  body.dash-open .dash{transform:none}
  body.rail-open .scrim,body.dash-open .scrim{display:block}
  .rail.collapsed,.dash.collapsed{transform:translateX(-102%)}  /* keep off-canvas default */
  .dash.collapsed{transform:translateX(102%)}
  .kpis{gap:10px}.kpi:nth-child(n+3){display:none}  /* trim KPIs on phone */
  #builtTag{display:none}
}
.gate-mask{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),#1c3b5e);z-index:4000;display:flex;align-items:center;justify-content:center}
.gate-box{background:#fff;border-radius:16px;padding:34px 34px 28px;width:340px;max-width:92%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gate-logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--integrated),#e0564f);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.gate-box h2{font-size:17px;font-weight:800;color:var(--navy)}
.gate-box p{font-size:11px;color:var(--muted);margin:6px 0 16px;line-height:1.5}
.gate-box input{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:9px;font-size:14px;text-align:center;font-family:inherit}
.gate-box input:focus{outline:none;border-color:var(--blue)}
#gateErr{color:var(--integrated);font-size:11px;margin-top:8px;font-weight:600}
.gate-box button{margin-top:14px;width:100%;background:var(--integrated);color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.gate-box button:hover{background:#b32d27}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 28px rgba(14,36,64,.28);padding:0;overflow:hidden}
.leaflet-popup-content{margin:0;width:266px!important}
.pop-cta{margin-top:10px;padding:7px 9px;background:var(--cream);border:1px solid var(--line2);border-radius:8px;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;text-align:center}
.pop-cta:hover{background:#eef3f7;border-color:var(--blue)}
.pop-head{padding:13px 15px 11px;color:#fff;background:linear-gradient(120deg,var(--navy),var(--navy2))}
.pop-head .pt{font-size:9px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:6px}
.pop-head h4{font-size:14px;font-weight:700;line-height:1.25}
.pop-head .loc{font-size:10.5px;color:#aebfd2;margin-top:3px}
.pop-head .rid{font-size:9px;color:#8aa0bb;margin-top:3px;letter-spacing:.3px}
.pop-body{padding:6px 15px 14px;background:#fff;max-height:62vh;overflow-y:auto}
.pop-sec{margin-top:9px}
.pop-sec .sh{font-size:9.5px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}
.pop-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3.5px 0}
.pop-row .k{color:var(--muted);flex:0 0 auto}
.pop-row .v{font-weight:600;text-align:right}
.pop-prod{margin-top:5px}
.ptag{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:5px;margin:2px 3px 0 0;color:#fff}
.capbar{height:8px;border-radius:4px;display:flex;overflow:hidden;background:#eee;margin-top:5px}
.capbar i{height:100%}
.cap-leg{font-size:9.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
.inv-note{margin-top:7px;font-size:10px;color:#9a7b1c;background:#fcf5df;border:1px dashed #e0c869;border-radius:7px;padding:7px 9px;line-height:1.45}
.src-badge{margin-top:10px;font-size:9px;color:var(--muted);text-align:right}
.dash{width:360px;flex:0 0 360px;background:var(--cream2);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:1000;box-shadow:-3px 0 14px rgba(20,40,70,.05)}
.dash-head{padding:12px 15px 10px;border-bottom:1px solid var(--line);background:#fff}
.dash-head .t{font-size:13px;font-weight:700;color:var(--navy)}
.dash-head .scope{font-size:10.5px;color:var(--muted);margin-top:2px}
.dash-scroll{overflow-y:auto;flex:1;padding:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
.card .ct{font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.card .cs{font-size:9.5px;color:var(--muted);margin-bottom:7px}
.chart{width:100%}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.stat .v{font-size:19px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:600;color:var(--muted)}
.stat .l{font-size:9.5px;color:var(--muted);margin-top:2px}
.rank-row{display:flex;align-items:center;gap:8px;padding:6px 5px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.rank-row:hover{background:var(--cream)}
.rank-row .rn{font-size:10px;font-weight:800;color:var(--muted);width:16px;text-align:center}
.rank-row .rdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.rank-row .rnm{font-size:11px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .rcy{font-size:9px;color:var(--muted)}
.rank-row .rcap{font-size:11px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.ob-mask{position:fixed;inset:0;background:rgba(14,36,64,.65);z-index:3000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);padding:20px}
.ob{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
.ob-top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 24px;flex:0 0 auto}
.ob-top h2{font-size:18px;font-weight:800}
.ob-top p{font-size:12px;color:#aebfd2;margin-top:4px}
.ob-steps{padding:14px 24px 6px;overflow-y:auto}
.ob-step{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.ob-step:last-child{border-bottom:none}
.ob-n{width:26px;height:26px;border-radius:50%;background:var(--integrated);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.ob-step .tx b{font-size:13px}.ob-step .tx p{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.ob-foot{padding:12px 24px 18px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;border-top:1px solid var(--line)}
.ob-foot label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.ob-go{background:var(--integrated);color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer}
.ob-go:hover{background:#b32d27}
.legend-note{font-size:10px;color:var(--muted);line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.toggle-eye{font-size:10px;color:var(--blue);cursor:pointer;font-weight:600}
.backlink{font-size:12px;font-weight:700;color:var(--blue);cursor:pointer}
.backlink:hover{text-decoration:underline}
.pp-hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:11px;padding:13px 14px;margin-bottom:11px}
.pp-hero .pt{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block;margin-bottom:6px}
.pp-hero h3{font-size:15px;font-weight:800;line-height:1.25}
.pp-hero .ln{font-size:10.5px;color:#aebfd2;margin-top:3px}
.pp-hero .rid{font-size:9px;color:#8aa0bb;margin-top:4px}
.pp-mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.pp-m{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.pp-m .v{font-size:16px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.pp-m .v small{font-size:10px;color:var(--muted);font-weight:600}
.pp-m .l{font-size:9px;color:var(--muted);margin-top:1px}
.tl{position:relative;padding-left:16px;margin-top:4px}
.tl:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl-node{position:relative;padding:5px 0 7px 4px}
.tl-node:before{content:"";position:absolute;left:-15px;top:7px;width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.tl-node.op:before{background:#2E9E83}.tl-node.con:before{background:#E0731B}.tl-node.ann:before{background:#1B6CA8}.tl-node.ret:before{background:#8A8F98}
.tl-node .yr{font-size:11.5px;font-weight:800;color:var(--navy)}
.tl-node .ds{font-size:10.5px;color:var(--muted);margin-top:1px}
.tl-node .cp{font-weight:700;color:var(--ink)}
.pp-future{background:#eef7f3;border:1px solid #bfe3d6;border-radius:9px;padding:10px 11px;font-size:11px;color:#1d6b54;line-height:1.5}
.pp-future b{color:#13533f}
.furn{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:4px 0;border-bottom:1px dotted var(--line)}
.furn .fu{font-weight:700;color:var(--navy)}
.furn .fmid{color:var(--muted);flex:1;text-align:center}
.pp-tag{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:5px;margin:2px 3px 0 0;color:#fff}
.pp-kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pp-kv .k{color:var(--muted)}.pp-kv .v{font-weight:600;text-align:right}
@media(max-width:1240px){.dash{display:none}}
@media(max-width:880px){.rail{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">SMM</div>
      <div class="title"><h1><span data-i18n="appTitle"></span> <span class="tag" data-i18n="tag"></span></h1><p data-i18n="subtitle"></p></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v red" id="kCap">–</div><div class="l" data-i18n="kCap"></div></div>
      <div class="kpi-div"></div>
      <div class="kpi"><div class="v" id="kPlants">–</div><div class="l" data-i18n="kPlants"></div></div>
      <div class="kpi-div"></div>
      <div class="kpi"><div class="v orange" id="kEAF">–</div><div class="l" data-i18n="kEAF"></div></div>
      <div class="kpi-div"></div>
      <div class="kpi"><div class="v green" id="kDRI">–</div><div class="l" data-i18n="kDRI"></div></div>
      <span id="builtTag" title="数据版本时间"></span>
      <div class="lang-tog"><span id="langZh" class="on">中</span><span id="langEn">EN</span></div>
      <button class="btn" onclick="showOnboard()" data-i18n="guide"></button>
    </div>
  </header>
  <div class="body">
    <div class="rail">
      <div class="rail-scroll">
        <div class="sec"><h3><span data-i18n="hSearch"></span> <span class="hint" data-i18n="hSearchHint"></span></h3>
          <input class="search" id="search" data-i18n-ph="phSearch"></div>
        <div class="sec"><h3><span data-i18n="hPrimary"></span> <span class="hint" data-i18n="hClick"></span></h3>
          <div class="layer" data-type="integrated"><span class="dot" style="background:var(--integrated)"></span><span class="nm" data-i18n="tIntegrated"></span><span class="ct" id="c-integrated"></span></div>
          <div class="layer" data-type="eaf"><span class="dot" style="background:var(--eaf)"></span><span class="nm" data-i18n="tEaf"></span><span class="ct" id="c-eaf"></span></div>
          <div class="layer" data-type="rolling"><span class="dot sq" style="background:var(--rolling)"></span><span class="nm" data-i18n="tRolling"></span><span class="ct" id="c-rolling"></span></div></div>
        <div class="sec"><h3><span data-i18n="hSecondary"></span> <span class="hint" data-i18n="hChain"></span></h3>
          <div class="layer" data-type="dri"><span class="dot" style="background:var(--dri)"></span><span class="nm" data-i18n="tDri"></span><span class="ct" id="c-dri"></span></div>
          <div class="layer" data-type="bf_iron"><span class="dot" style="background:var(--iron)"></span><span class="nm" data-i18n="tBf"></span><span class="ct" id="c-bf_iron"></span></div>
          <div class="layer" data-type="mine"><span class="dot" style="background:#9C6B2E"></span><span class="nm" data-i18n="tMine"></span><span class="ct" id="c-mine"></span></div></div>
        <div class="sec"><h3 data-i18n="hStatus"></h3>
          <div class="chips" id="statusChips">
            <span class="chip on" data-st="operating" data-i18n="stOperating"></span>
            <span class="chip" data-st="construction" data-i18n="stConstruction"></span>

function radius(c){return Math.max(4,Math.min(26,3.4*Math.sqrt((c||0.05))));}
function statusKey(st){return st.startsWith("operating")?"operating":st==="construction"?"construction":st==="announced"?"announced":(["retired","cancelled","mothballed"].includes(st)||st.includes("retire"))?"retired":"operating";}
function visible(p){
  if(!state.layers[groupOf(p.type)])return false;
  if(!state.status[statusKey(p.status)])return false;
  if(state.region!=="ALL"&&p.rg!==state.region)return false;

  if(state.ow==="state"&&!(p.soe==="Full"||p.soe==="Partial"))return false;

let ppChart=null;
function renderTimelineChart(p){
  const el=document.getElementById('ppTL'); if(!el)return;
  if(ppChart){try{ppChart.dispose();}catch(e){} ppChart=null;}
  const L=L_(); const NOW=2026;
  const clsOf=st=>['retired','cancelled'].includes(st)?'ex':(['construction','announced'].includes(st)?'fut':'built');
  // ---- crude steel additions (from phases) ----
  const yrOf=x=>{ if(x.yr)return x.yr; const s=parseInt(p.start); return isNaN(s)?null:s; };
  let crude=(p.phases||[]).filter(x=>x.cap>0)
    .map(x=>({yr:yrOf(x),val:+x.cap.toFixed(2),c:clsOf((x.st||'').trim())})).filter(x=>x.yr&&x.c!=='ex');
  if(!crude.length){ const s=parseInt(p.start); if(!isNaN(s)&&p.cap_op>0)crude=[{yr:s,val:+p.cap_op.toFixed(2),c:'built'}]; }
  // ---- ironmaking additions (from per-furnace start years) — shows real multi-decade build-up ----
  const iron=(p.bf_units||[]).filter(u=>u.yr&&u.cap>0)
    .map(u=>{const k=(u.st||'').replace(/\s/g,''); return {yr:u.yr,val:+u.cap.toFixed(2),c:k.startsWith('construction')||k.startsWith('announced')?'fut':(k.startsWith('retired')||k.startsWith('idled')?'ex':'built')};})
    .filter(x=>x.c!=='ex');
  const allYrs=crude.concat(iron).map(x=>x.yr);
  if(!allYrs.length)return;
  const start=Math.min.apply(null,allYrs), endFut=Math.max(NOW,Math.max.apply(null,allYrs));
  const span=endFut-start; const step=span<=16?2:(span<=40?5:10);
  const yrs=[]; for(let y=start;y<=endFut;y++)yrs.push(y);
  const cum=(arr,y,kinds)=>arr.filter(x=>x.yr<=y&&kinds.indexOf(x.c)>=0).reduce((a,x)=>a+x.val,0);

  var rs=document.getElementById('regionSel'); if(rs)rs.value=state.region;
  var csl=document.getElementById('countrySel'); if(csl)csl.value=state.country;
  var cm=document.getElementById('capMin'); if(cm){cm.value=state.capMin;document.getElementById('capMinV').textContent=state.capMin;}
  var sb=document.getElementById('search'); if(sb)sb.value=state.q;
}
document.getElementById('btnCsv').addEventListener('click',exportCSV);
document.getElementById('btnPng').addEventListener('click',exportPNG);
document.getElementById('btnShare').addEventListener('click',shareLink);
document.querySelectorAll('.layer').forEach(el=>el.addEventListener('click',()=>{const t=el.dataset.type;state.layers[t]=state.layers[t]?0:1;el.classList.toggle('off',!state.layers[t]);render();}));
document.querySelectorAll('#statusChips .chip').forEach(el=>el.addEventListener('click',()=>{const s=el.dataset.st;state.status[s]=state.status[s]?0:1;el.classList.toggle('on',!!state.status[s]);render();}));
document.querySelectorAll('#pcChips .chip').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.pc; if(state.pcats.has(k))state.pcats.delete(k); else state.pcats.add(k); el.classList.toggle('on',state.pcats.has(k)); render();}));
document.querySelectorAll('#owChips .chip').forEach(el=>el.addEventListener('click',()=>{state.ow=el.dataset.ow; document.querySelectorAll('#owChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.ow===state.ow)); render();}));
document.querySelectorAll('#greenChips .chip').forEach(el=>el.addEventListener('click',()=>{state.green=state.green?0:1;el.classList.toggle('on',!!state.green);render();}));
document.getElementById('regionSel').addEventListener('change',e=>{state.region=e.target.value;
  if(state.region!=="ALL"){const pts=DATA.filter(p=>p.rg===state.region&&p.lat); if(pts.length){const b=L.latLngBounds(pts.map(p=>[p.lat,p.lng]));map.fitBounds(b.pad(0.1));}} else map.setView([28,18],3); render();});
document.getElementById('countrySel').addEventListener('change',e=>{state.country=e.target.value; zoomCountry(); render();});
document.getElementById('capMin').addEventListener('input',e=>{state.capMin=+e.target.value;document.getElementById('capMinV').textContent=e.target.value;render();});
let qt; document.getElementById('search').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();render();},220);});
document.getElementById('resetBtn').addEventListener('click',()=>{
  state.layers={integrated:1,eaf:1,rolling:1,dri:1,bf_iron:1}; state.status={operating:1}; state.pcats=new Set(); state.ow="all"; state.green=0; state.region="ALL"; state.country="ALL"; state.capMin=0; state.q="";
  document.querySelectorAll('.layer').forEach(e=>e.classList.remove('off'));
  document.querySelectorAll('#statusChips .chip').forEach(e=>e.classList.toggle('on',e.dataset.st==="operating"));
  document.querySelectorAll('#pcChips .chip').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#owChips .chip').forEach(e=>e.classList.toggle('on',e.dataset.ow==="all"));
  document.querySelectorAll('#greenChips .chip').forEach(e=>e.classList.remove('on'));
  document.getElementById('search').value=""; document.getElementById('capMin').value=0; document.getElementById('capMinV').textContent="0"; document.getElementById('regionSel').value="ALL"; document.getElementById('countrySel').value="ALL";
  map.setView([28,18],3); render();});
window.addEventListener('resize',()=>{for(const k in charts)charts[k].resize(); if(ppChart)ppChart.resize();});
function showOnboard(){document.getElementById('obMask').style.display='flex';}
function hideOnboard(){document.getElementById('obMask').style.display='none';}
(function initOnboard(){let seen=false;try{seen=localStorage.getItem('gist_ob')==='1';}catch(e){} if(!seen)showOnboard();
  document.getElementById('obSkip').addEventListener('change',e=>{try{localStorage.setItem('gist_ob',e.target.checked?'1':'0');}catch(e){}});})();
function boot(){ applyURLState(); setKPIs(); applyLang(); syncControls(); setBuiltTag();
  if(state.region!=="ALL"){var pts=DATA.filter(function(p){return p.rg===state.region&&p.lat;});if(pts.length){try{map.fitBounds(L.latLngBounds(pts.map(function(p){return [p.lat,p.lng];})).pad(0.1));}catch(e){}}}
}
function setBuiltTag(){ var el=document.getElementById('builtTag'); if(!el||!BUILT||BUILT.indexOf("__")===0)return;
  el.textContent=(state.lang==="zh"?"数据更新 ":"Updated ")+BUILT.slice(0,16).replace("T"," ")+" UTC"; }
// ---- 版本监测：托管版每5分钟查一次 version.txt，发现新数据即提示同事刷新（无需手动） ----
function startVersionWatch(){
  setInterval(function(){
    fetch('version.txt?t='+Date.now()).then(function(r){return r.ok?r.text():null;}).then(function(v){
      if(v && v.trim() && v.trim()!==BUILT){
        var t=document.getElementById('newdata'); var z=state.lang==="zh";
        document.getElementById('newdataTxt').textContent=z?"📡 数据已更新":"📡 New data available";
        document.getElementById('newdataBtn').textContent=z?"刷新":"Refresh";
        t.style.display="flex";
      }
    }).catch(function(){});
  }, 300000);
}
// ---- data loading: hosted mode fetches plants.json (live auto-update); offline mode uses embedded DATA ----
function loadData(){
  if(DATA==="__FETCH__"){
    fetch('plants.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(d){DATA=d; boot(); startVersionWatch();})
      .catch(function(){document.getElementById('map').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#0E2440">数据加载失败 / Failed to load plants.json。请确认它与本页面在同一目录，并通过 http(s) 访问（不能用本地 file:// 直接打开托管版）。</div>';});
  } else { boot(); }
}
(function gateThen(){
  if(GATE){ var m=document.getElementById('gateMask'); var ok=false;
    try{ok=localStorage.getItem('gist_gate')===GATE;}catch(e){}
    if(ok){ loadData(); }
    else { m.style.display='flex';
      var go=function(){ if(document.getElementById('gateInput').value===GATE){ try{localStorage.setItem('gist_gate',GATE);}catch(e){} m.style.display='none'; loadData(); } else { document.getElementById('gateErr').style.display='block'; } };
      document.getElementById('gateBtn').onclick=go;
      document.getElementById('gateInput').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
    }
  } else { loadData(); }
})();
</script>
</body>
</html>
